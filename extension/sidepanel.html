<!doctype html>
<html lang="ko">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>피싱 URL 검사 · 상세</title>
    <link rel="stylesheet" href="sidepanel.css">
    <script type="module" src="sidepanel.js"></script>
  </head>
  <body>
    <header class="side-header"><img class="side-mark" src="icons/sch-seal128.png" alt="순천향대학교 원형 로고"><strong>피싱 URL 검사 · 상세</strong><span class="demo-tag">시연용</span></header>
    <main>
      <section class="section result-section">
        <div class="eyebrow">AI URL 검사 결과</div>
        <div class="result-heading"><h1 id="detail-headline">검사 결과가 없습니다</h1><span id="detail-mascot" class="detail-mascot mascot-sunflower" aria-hidden="true"></span></div>
        <div id="detail-url" class="url-value">확장 팝업에서 URL을 검사해 주세요.</div>
        <p class="small-note">이 결과만으로 피싱 또는 정상 사이트를 확정하지 않습니다.</p>
      </section>

      <section class="section">
        <h2>확인된 URL 신호</h2>
        <ul id="detail-signals" class="signal-list"><li>아직 검사한 URL이 없습니다.</li></ul>
      </section>

      <section class="section">
        <h2>다음 분석 단계</h2>
        <div class="future-row"><span>AI URL 분류</span><strong>로컬 모델 사용</strong></div>
        <div class="future-row"><span>도메인 등록 정보</span><strong>조회 기능 연결 전</strong></div>
        <div class="future-row"><span>브랜드 로그인 화면 비교</span><strong>동의 절차 구현 전</strong></div>
      </section>

      <section class="section">
        <h2>오탐 신고</h2>
        <p class="small-note">신고 접수 화면과 서버 저장 기능은 다음 단계에서 연결합니다.</p>
      </section>
    </main>
  </body>
</html>
